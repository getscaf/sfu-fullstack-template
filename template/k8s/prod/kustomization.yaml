apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: {{ copier__rfc1123_subdomain }}-prod

resources:
  - ../sandbox

patches:
- target:
    kind: SealedSecret
    name: secrets-config
  path: secrets.yaml
- patch: |-
    - op: replace
      path: /spec/issuerRef/name
      value: letsencrypt-prod
    - op: replace
      path: /spec/dnsNames
      value:
        - api.prod.{{ copier__domain_name }}
        - k8s.prod.{{ copier__domain_name }}
{% if copier__create_nextjs_frontend %}
        - nextjs.prod.{{ copier__domain_name }}
{% endif %}
  target:
    kind: Certificate
    name: cluster-cert
- patch: |-
    - op: replace
      path: /metadata/annotations/cert-manager.io~1cluster-issuer
      value: letsencrypt-prod
    - op: replace
      path: /spec/routes/0/match
      value: Host(`api.prod.{{ copier__domain_name }}`)
  target:
    kind: IngressRoute
    name: backend-ingress
- patch: |-
    - op: replace
      path: /metadata/annotations/cert-manager.io~1cluster-issuer
      value: letsencrypt-prod
    - op: replace
      path: /spec/routes/0/match
      value: Host(`k8s.prod.{{ copier__domain_name }}`)
  target:
    kind: IngressRoute
    name: k8s-ingress
- patch: |-
    - op: replace
      path: /spec/backup/barmanObjectStore/destinationPath
      value: "s3://{{ copier__project_dash }}-prod-backups/"
  target:
    kind: Cluster
    name: postgres
{% if copier__create_nextjs_frontend %}
- patch: |-
    - op: replace
      path: /spec/routes/0/match
      value: Host(`nextjs.prod.{{ copier__domain_name }}`)
    - op: replace
      path: /metadata/annotations/cert-manager.io~1cluster-issuer
      value: letsencrypt-prod
  target:
    kind: IngressRoute
    name: frontend-ingress
- patch: |-
    - op: add
      path: /data/DISTRIBUTION_ID
      value: "CHANGEME"
  target:
    kind: ConfigMap
    name: app-config{% endif %}

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
     - ENVIRONMENT="production"
     - DJANGO_SETTINGS_MODULE="config.settings.production"
     - DJANGO_AWS_STORAGE_BUCKET_NAME="{{ copier__project_dash }}-prod-static-storage"
     - DJANGO_CSRF_TRUSTED_ORIGINS="https://api.prod.{{ copier__domain_name }}{% if copier__create_nextjs_frontend %},https://prod.{{ copier__domain_name }},https://nextjs.prod.{{ copier__domain_name }}{% endif %}"
{% if copier__create_nextjs_frontend %}
     - CORS_ALLOWED_ORIGINS="https://prod.{{ copier__domain_name }},https://nextjs.prod.{{ copier__domain_name }}"
     - CORS_ALLOW_CREDENTIALS=True
{% endif %}
     - AWS_S3_CUSTOM_DOMAIN="prod.{{ copier__domain_name }}"
{% if copier__use_wagtail %}
     - CMS_BACKEND_BASE_URL="https://api.prod.{{ copier__domain_name }}"
     - CMS_PUBLIC_BASE_URL="https://{% if not copier__create_nextjs_frontend %}api.{% endif %}prod.{{ copier__domain_name }}"
{% endif %}

images:
  - name: {{ copier__aws_account_id }}.dkr.ecr.{{ copier__aws_region }}.amazonaws.com/{{ copier__project_dash }}-sandbox-backend
    newName: {{ copier__aws_account_id }}.dkr.ecr.{{ copier__aws_region }}.amazonaws.com/{{ copier__project_dash }}-backend
    newTag: latest
{% if copier__create_nextjs_frontend %}
  - name: {{ copier__aws_account_id }}.dkr.ecr.{{ copier__aws_region }}.amazonaws.com/{{ copier__project_dash }}-sandbox-frontend
    newName: {{ copier__aws_account_id }}.dkr.ecr.{{ copier__aws_region }}.amazonaws.com/{{ copier__project_dash }}-frontend
    newTag: latest{% endif %}
