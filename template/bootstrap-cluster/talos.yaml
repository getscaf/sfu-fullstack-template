version: '3'
env:
  TALOSCONFIG: ./{{ '{{.ENV}}' }}/talosconfig
  KUBECONFIG: ./{{ '{{.ENV}}' }}/kubeconfig
tasks:
  bootstrap:
    desc: |
      Run all tasks required to bootstrap the Talos and Kubernetes cluster.
    requires:
      vars: [ENV]
    cmds:
      - task: generate_configs
        vars: {ENV: {{ "'{{.ENV}}'" }}}
      - task: set_node_ips
        vars: {ENV: {{ "'{{.ENV}}'" }}}
      - task: store_controlplane_config
        vars: {ENV: {{ "'{{.ENV}}'" }}}
      - task: store_talosconfig
        vars: {ENV: {{ "'{{.ENV}}'" }}}
      - task: apply_talos_config
        vars: {ENV: {{ "'{{.ENV}}'" }}}
      - sleep 30
      - task: bootstrap_kubernetes
        vars: {ENV: {{ "'{{.ENV}}'" }}}
      - sleep 30
      - task: generate_kubeconfig
        vars: {ENV: {{ "'{{.ENV}}'" }}}
      - task: store_kubeconfig
        vars: {ENV: {{ "'{{.ENV}}'" }}}
      - task: upgrade_talos
        vars: {ENV: {{ "'{{.ENV}}'" }}}
      - task: enable_ecr_credential_helper
        vars: {ENV: {{ "'{{.ENV}}'" }}}
  generate_configs:
    desc: |
      Generate the initial Talos configuration files for the control plane
      and Talos nodes.
    requires:
      vars: [ENV, KUBERNETES_VERSION]
    vars:
      CLUSTER_NAME:
        sh: yq -r '.CLUSTER_NAME' {{ '{{.ENV}}' }}/.env
      CONTROL_PLANE_ENDPOINT:
        sh: yq -r '.CONTROL_PLANE_ENDPOINT' {{ '{{.ENV}}' }}/.env
    cmds:
      - |
        talosctl gen config {{ '{{.CLUSTER_NAME}}' }} {{ '{{.CONTROL_PLANE_ENDPOINT}}' }} \
          --kubernetes-version {{ '{{.KUBERNETES_VERSION}}' }} \
          --output-types controlplane,talosconfig \
          --output ./{{ '{{.ENV}}' }}/ \
          --config-patch @patches/patch-machine.yaml \
          --config-patch-control-plane @patches/patch-control-plane.yaml \
          --with-examples=false \
          --with-docs=false
  set_node_ips:
    desc: |
      Set the endpoints in the Talos configuration to the public IPs of the
      control plane nodes, and the nodes to their private IPs, from Terraform
      output. Talos forwards requests from an endpoint to the target node.
      Forwarding to a node's public IP is blocked by the security group, so
      the nodes use their private IPs.
    vars:
      EC2_HOSTS:
        sh: |
          tofu -chdir=../terraform/{{ '{{.ENV}}' }} \
            output -raw control_plane_nodes_public_ips | tr ',' ' '
      EC2_PRIVATE_IPS:
        sh: |
          tofu -chdir=../terraform/{{ '{{.ENV}}' }} \
            output -raw control_plane_nodes_private_ips | tr ',' ' '
    requires:
      vars: [ENV]
    cmds:
      - talosctl config endpoint {{ '{{.EC2_HOSTS}}' }}
      - talosctl config node {{ '{{.EC2_PRIVATE_IPS}}' }}
  apply_talos_config:
    desc: |
      Apply the Talos configuration to all nodes in the control plane.
    cmds:
      - |
        for node in $(yq -r '.contexts[].endpoints[]' $TALOSCONFIG); do \
          echo "Applying config to $node" && \
          talosctl apply-config \
            --insecure \
            --nodes $node \
            --file ./{{ '{{.ENV}}' }}/controlplane.yaml; \
        done
  bootstrap_kubernetes:
    desc: |
      Bootstrap the Kubernetes cluster on the first control plane node.
    vars:
      FIRST_NODE:
        sh: yq -r '.contexts[].nodes[0]' {{ '{{.ENV}}' }}/talosconfig
    cmds:
      - talosctl bootstrap --nodes {{ '{{.FIRST_NODE}}' }}
  generate_kubeconfig:
    desc: |
      Generate the kubeconfig file to access the Kubernetes cluster using
      Talos.
    vars:
      FIRST_NODE:
        sh: yq -r '.contexts[].nodes[0]' {{ '{{.ENV}}' }}/talosconfig
    cmds:
      - talosctl kubeconfig $KUBECONFIG --nodes {{ '{{.FIRST_NODE}}' }} --force
  upgrade_talos:
    desc: |
      Reinstall Talos on all control plane nodes from the Image Factory
      installer to add the schematic's system extensions. Each node keeps
      the Talos version it booted with.
    requires:
      vars: [TALOS_FACTORY_INSTALLER]
    cmds:
      - task: health
        vars: {ENV: {{ "'{{.ENV}}'" }}}
      - |
        for node in $(yq -r '.contexts[].nodes[]' $TALOSCONFIG); do
          tag=$(talosctl version --nodes $node --short | awk '/Tag:/ {print $2}'); \
          if [ -z "$tag" ]; then echo "Could not read the Talos version of $node"; exit 1; fi; \
          echo "Installing {{ '{{.TALOS_FACTORY_INSTALLER}}' }}:$tag on $node"; \
          talosctl upgrade --nodes $node --image {{ '{{.TALOS_FACTORY_INSTALLER}}' }}:$tag; \
        done
  enable_ecr_credential_helper:
    desc: |
      Enable the ECR credential helper on all control plane nodes.
    cmds:
      - task: health
        vars: {ENV: {{ "'{{.ENV}}'" }}}
      - |
        for node in $(yq -r '.contexts[].nodes[]' $TALOSCONFIG); do
          talosctl patch mc \
            --nodes $node \
            --patch @patches/patch-ecr-credential-helper.yaml; \
        done
  store_talosconfig:
    desc: Store the Talos configuration in its Terraform-managed AWS secret.
    cmds:
      - task: store_config_secret
        vars:
          ENV: {{ "'{{.ENV}}'" }}
          SECRET_KEY: talosconfig_yaml
          CONFIG_FILE: "$TALOSCONFIG"

  store_controlplane_config:
    desc: Store the control plane configuration in its Terraform-managed AWS secret.
    cmds:
      - task: store_config_secret
        vars:
          ENV: {{ "'{{.ENV}}'" }}
          SECRET_KEY: talos_controlplane_yaml
          CONFIG_FILE: "./{{ '{{.ENV}}' }}/controlplane.yaml"

  store_kubeconfig:
    desc: Store the kubeconfig in its Terraform-managed AWS secret.
    cmds:
      - task: store_config_secret
        vars:
          ENV: {{ "'{{.ENV}}'" }}
          SECRET_KEY: kubeconfig
          CONFIG_FILE: "$KUBECONFIG"

  store_config_secret:
    internal: true
    requires:
      vars: [ENV, SECRET_KEY, CONFIG_FILE]
    cmds:
      - |
        set -eu -o pipefail
        secret_arn=$(tofu -chdir=../terraform/{{ '{{.ENV}}' }} output -json cluster_secret_arns |
          jq -er --arg name "{{ '{{.SECRET_KEY}}' }}" '.[$name]')
        value=$(base64 < "{{ '{{.CONFIG_FILE}}' }}" | tr -d '\n')
        aws secretsmanager put-secret-value --region "{{ copier__aws_region }}" \
          --secret-id "$secret_arn" --secret-string "$value" > /dev/null
  health:
    desc: |
      Check the health of the Talos cluster. The checks run from this
      machine, because nodes can't reach the Kubernetes API through the load
      balancer's public address.
    vars:
      FIRST_NODE:
        sh: yq -r '.contexts[].nodes[0]' {{ '{{.ENV}}' }}/talosconfig
    cmds:
      - talosctl health --server=false --nodes {{ '{{.FIRST_NODE}}' }}
  services:
    desc: |
      Check service status on all notes.
    cmds:
      - |
        for node in $(yq -r '.contexts[].nodes[]' $TALOSCONFIG); do
          talosctl service --nodes $node;
        done
  reset_config:
    desc: Remove the local cluster configuration files.
    requires:
      vars: [ENV]
    cmds:
      - cd {{ '{{.ENV}}' }} && rm -f controlplane.yaml kubeconfig talosconfig
  kubeconfig:
    desc: |
      Retrieve the Kubeconfig for a given cluster

      Since the commands run in sub-shell you can eval the output to export
      KUBECONFIG to your current shell:

        eval $(task talos:kubeconfig)
    silent: true
    cmds:
      - task: generate_kubeconfig
        vars: {ENV: {{ "'{{.ENV}}'" }}}
      - echo "export KUBECONFIG=$(pwd)/{{ '{{.ENV}}' }}/kubeconfig"
  fetch_config:
    desc: Fetch cluster configuration from Terraform-managed AWS secrets.
    requires:
      vars: [ENV]
    cmds:
      - |
        set -eu -o pipefail
        arns=$(tofu -chdir=../terraform/{{ '{{.ENV}}' }} output -json cluster_secret_arns)
        for config in kubeconfig talosconfig controlplane.yaml; do
          case "$config" in
            kubeconfig) key=kubeconfig ;;
            talosconfig) key=talosconfig_yaml ;;
            controlplane.yaml) key=talos_controlplane_yaml ;;
          esac
          secret_arn=$(printf '%s' "$arns" | jq -er --arg name "$key" '.[$name]')
          config_path="./{{ '{{.ENV}}' }}/$config"
          temporary_file=$(mktemp "$config_path.XXXXXX")
          trap 'rm -f "$temporary_file"' EXIT
          aws secretsmanager get-secret-value --region "{{ copier__aws_region }}" \
            --secret-id "$secret_arn" --query SecretString --output text | \
            base64 -d > "$temporary_file"
          mv "$temporary_file" "$config_path"
        done
