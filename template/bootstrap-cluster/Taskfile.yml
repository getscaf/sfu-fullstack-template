version: '3'
vars:
  ENV: {{ "'{{.ENV}}'" }}
  KUBERNETES_VERSION: 1.36.6
{%- if copier__operating_system == "talos" %}
  # Image Factory AWS installer for a schematic that adds the ECR credential
  # provider extension. The tag is the Talos version the node booted with.
  # Use the aws-installer: the plain installer boots nodes as bare metal, so
  # they lose the AWS metadata, including their public IP.
  TALOS_FACTORY_INSTALLER: factory.talos.dev/aws-installer/10e276a06c1f86b182757a962258ac00655d3425e5957f617bdc82f06894e39b
{%- endif %}

includes:
  argocd:
    taskfile: ./argocd.yaml
    vars:
      ENV: {{ "'{{.ENV}}'" }}
      ARGOCD_VERSION: {{ "'{{.ARGOCD_VERSION}}'" }}

{%- if copier__operating_system == "talos" %}
  talos:
    taskfile: ./talos.yaml
    vars:
      ENV: {{ "'{{.ENV}}'" }}
{%- elif copier__operating_system == "k3s" %}
  k3s:
    taskfile: ./k3s.yaml
    vars:
      ENV: {{ "'{{.ENV}}'" }}
{%- endif %}

tasks:
  default:
    desc: |
      List all available tasks in the Taskfile.
    cmds:
      - task --list
