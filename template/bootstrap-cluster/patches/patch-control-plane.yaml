# Allow scheduling workloads on the control plane since we don't have a
# separate control plane. This is the generated control-plane node config
# without the NoSchedule taint.
apiVersion: v1alpha1
kind: KubeNodeConfig
registerWithFQDN: true
nodeIP: {}
labels:
  node-role.kubernetes.io/control-plane: ""
  node.kubernetes.io/exclude-from-external-load-balancers: ""
---
cluster:
  # Install Kubelet Serving Certificate Approver and metrics-server during
  # bootstrap
  extraManifests:
    - "https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml"
    - "https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml"
