[pytest]
# E2E Verification Test Configuration
asyncio_mode = auto
asyncio_default_fixture_scope = session

# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = -v --tb=short --strict-markers
log_cli = false
log_level = INFO

# Markers for test categorization
markers =
    health: health check tests that verify service readiness
    frontend: frontend availability tests
    api: backend API tests
    database: database connectivity tests
    workflow: complete workflow tests
