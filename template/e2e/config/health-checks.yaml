# Service Health Check Configuration
# LOCALHOST TARGETS: These use port-forwards from 'tilt up' or 'tilt ci'
# To override URLs, set environment variables: FRONTEND_URL, BACKEND_URL, DB_HOST, DB_NAME, DB_USER

services:
  frontend:
    name: "Frontend"
    type: "http"
    url: "${FRONTEND_URL:-http://localhost:3000}"
    health_endpoint: "/"
    expected_status: 200
    description: "Next.js web application"
    timeout_seconds: 30
  
  backend:
    name: "Backend API"
    type: "http"
    url: "${BACKEND_URL:-http://localhost:8000}"
    health_endpoint: "/healthz"
    expected_status: 200
    description: "Django REST API service"
    timeout_seconds: 30
  
  database:
    name: "PostgreSQL Database"
    type: "database"
    host: "${DB_HOST:-localhost}"
    port: 5432
    database: "${DB_NAME:-myapp}"
    user: "${DB_USER:-myapp}"
    # Password should be provided via environment variable DB_PASSWORD
    health_check: "SELECT 1"
    description: "PostgreSQL database"
    timeout_seconds: 30

# Global health check settings
global:
  max_wait_seconds: 120
  check_interval_seconds: 2
  log_level: "info"
