name: Dependency tests

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: template/.python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.13.9'
          tofu_wrapper: false
      - name: Install validation tools
        run: pip install -r .github/requirements.txt
      - name: Run updater regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate all Python feature configurations
        run: python .github/scripts/python_locks.py --check
