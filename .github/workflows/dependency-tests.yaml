name: Dependency tests

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: template/.python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.13.9'
          tofu_wrapper: false
      - name: Install validation tools
        run: pip install -r .github/requirements.txt
      - name: Install Task and helper compatibility interpreter
        run: |
          mkdir -p "$RUNNER_TEMP/task-bin"
          curl -fsSL https://github.com/go-task/task/releases/download/v3.44.0/task_linux_amd64.tar.gz -o "$RUNNER_TEMP/task.tar.gz"
          echo "d6c9c0a14793659766ee0c06f9843452942ae6982a3151c6bbd78959c1682b82  $RUNNER_TEMP/task.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"
          uv python install 3.9
          echo "TEARDOWN_PYTHON39=$(uv python find 3.9)" >> "$GITHUB_ENV"
      - name: Run updater regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate all Python feature configurations
        run: python .github/scripts/python_locks.py --check
