name: Test template

on:
  pull_request:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install copier
      - run: python -m unittest tests.test_template_generation tests.test_node_version_hook

  storage-variants:
    runs-on: ubuntu-latest
    needs: generation
    strategy:
      fail-fast: false
      matrix:
        mail-service: ['Mailgun', 'Amazon SES', 'Other SMTP']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install copier
      - name: Generate a project for the selected mail service
        env:
          SCAF_MAIL_SERVICE: ${{ matrix.mail-service }}
        run: |
          python - <<'PY'
          import os
          from tests.generation import generate_project
          generate_project("storage-project", copier__mail_service=os.environ["SCAF_MAIL_SERVICE"])
          PY
      - name: Install generated production dependencies
        working-directory: storage-project/backend
        run: |
          # This focused import test does not require a full Docker/cluster setup.
          cp requirements/base.in requirements/base.txt
          pip install -r requirements/production.in
      - name: Test real production storage settings in isolation
        working-directory: storage-project/backend
        env:
          DJANGO_SECRET_KEY: test-only
          DATABASE_URL: 'sqlite:///:memory:'
        run: python -m django test cms_demo.utils.tests.test_storage --settings=config.settings.test

  test-template:
    runs-on: ubuntu-latest
    environment: dev
    needs: generation
    strategy:
      fail-fast: false
      matrix:
        nextjs: [true, false]
        wagtail: [true, false]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Proposed as fix for "no space left on device":
      # See https://github.com/actions/runner-images/issues/2875
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: 'template/frontend/package*.json'

      - name: Install kind
        shell: bash
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install Python dependencies
        shell: bash
        run: |
          pip install copier black isort

      - name: Configure Git
        shell: bash
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Template Test"

      - name: Test Template
        shell: bash
        run: |
          copier copy \
          --trust \
          --defaults \
          --vcs-ref=HEAD \
          --data copier__create_nextjs_frontend=${{ matrix.nextjs }} \
          --data copier__use_wagtail=${{ matrix.wagtail }} \
          . test-project

      - name: Run lint and formatting checks
        shell: bash
        run: |
          cd test-project
          make check-lint-and-formatting

      - name: Run frontend lint and tests
        if: matrix.nextjs
        shell: bash
        run: |
          cd test-project
          make check-lint-and-test-frontend

      - name: Install Tilt
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh | bash
          tilt version

      - name: Run Tilt CI
        shell: bash
        run: |
          set -euo pipefail
          cd test-project
          tilt ci

      - name: Run generated backend tests
        shell: bash
        run: |
          cd test-project
          SCAF_TEST_SLUG=$(python -c 'import yaml; print(yaml.safe_load(open(".copier-answers.yml"))["copier__project_slug"])')
          SCAF_TEST_NAMESPACE=$(kubectl get deployments --all-namespaces -l app=backend -o jsonpath='{.items[0].metadata.namespace}')
          kubectl -n "$SCAF_TEST_NAMESPACE" exec deployment/backend -c backend -- \
            python -m pytest "$SCAF_TEST_SLUG" --ds=config.settings.test

  notify:
    runs-on: ubuntu-latest
    needs: [generation, storage-variants, test-template]
    if: always() && github.event_name == 'schedule'
    steps:
      - name: Notify Slack on Success
        if: needs.generation.result == 'success' && needs.storage-variants.result == 'success' && needs.test-template.result == 'success'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Daily template test completed successfully! ✅"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "Daily template test completed successfully! ✅"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Repository*: ${{ github.repository }}"
                  - type: "mrkdwn"
                    text: >
                      *Run Details*:
                      <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>

      - name: Notify Slack on Failure
        if: needs.generation.result != 'success' || needs.storage-variants.result != 'success' || needs.test-template.result != 'success'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Daily template test failed! ❌"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "Daily template test failed! ❌"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "Please check the workflow logs for more information."
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Repository*: ${{ github.repository }}"
                  - type: "mrkdwn"
                    text: >
                      *Run Details*:
                      <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>
