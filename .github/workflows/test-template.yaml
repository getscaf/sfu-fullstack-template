name: Test template

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read

jobs:
  generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: 'template/.python-version'
      - run: pip install -r .github/requirements.txt
      - run: python -m unittest tests.test_template_generation

  storage-variants:
    runs-on: ubuntu-latest
    needs: generation
    strategy:
      fail-fast: false
      matrix:
        mail-service: ['Mailgun', 'Amazon SES', 'Other SMTP']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: 'template/.python-version'
      - run: pip install -r .github/requirements.txt
      - name: Generate a project for the selected mail service
        env:
          SCAF_MAIL_SERVICE: ${{ matrix.mail-service }}
        run: |
          python - <<'PY'
          import os
          from tests.generation import generate_project
          generate_project("storage-project", copier__mail_service=os.environ["SCAF_MAIL_SERVICE"])
          PY
      - name: Install generated production dependencies
        working-directory: storage-project/backend
        run: |
          # This focused import test does not require a full Docker/cluster setup.
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev
          pip install --no-deps -r requirements/build.txt
          pip install --no-deps --no-build-isolation -r requirements/production.txt
      - name: Test real production storage settings in isolation
        working-directory: storage-project/backend
        env:
          DJANGO_SECRET_KEY: test-only
          DATABASE_URL: 'sqlite:///:memory:'
        run: python -m django test cms_demo.utils.tests.test_storage --settings=config.settings.test

  test-template-variants:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 90
    needs: generation
    strategy:
      fail-fast: false
      matrix:
        nextjs: [true, false]
        wagtail: [true, false]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: template-test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 15432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Proposed as fix for "no space left on device":
      # See https://github.com/actions/runner-images/issues/2875
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'template/.node-version'
          cache: 'npm'
          cache-dependency-path: 'template/frontend/package*.json'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'template/.python-version'

      - name: Install kind
        shell: bash
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install Python dependencies
        shell: bash
        run: |
          pip install -r .github/requirements.txt

      - name: Configure Git
        shell: bash
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Template Test"

      - name: Test Template
        shell: bash
        run: |
          copier copy \
          --trust \
          --defaults \
          --vcs-ref=HEAD \
          --data copier__create_nextjs_frontend=${{ matrix.nextjs }} \
          --data copier__use_wagtail=${{ matrix.wagtail }} \
          . test-project

      - name: Run lint and formatting checks
        shell: bash
        run: |
          cd test-project
          make check-lint-and-formatting

      - name: Run frontend lint and tests
        if: matrix.nextjs
        shell: bash
        run: |
          cd test-project
          make check-lint-and-test-frontend

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://postgres:template-test@localhost:15432/postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev
          cd test-project
          CI=true make backend-test

      - name: Install Tilt
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/tilt-dev/tilt/master/scripts/install.sh | bash
          tilt version

      - name: Run Tilt CI
        shell: bash
        run: |
          set -euo pipefail
          cd test-project
          tilt ci

  # Keep one stable required check for branch protection and the nightly updater.
  test-template:
    runs-on: ubuntu-latest
    environment: dev
    needs: [generation, storage-variants, test-template-variants]
    if: always()
    steps:
      - name: Require all template checks to pass
        env:
          TEMPLATE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          results = json.loads(os.environ["TEMPLATE_RESULTS"])
          failures = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failures:
              raise SystemExit(f"Template checks did not pass: {failures}")
          PYTHON

      - name: Notify Slack on Failure
        if: failure() && github.event_name == 'schedule'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Daily template test failed! ❌"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "Daily template test failed! ❌"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "Please check the workflow logs for more information."
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Repository*: ${{ github.repository }}"
                  - type: "mrkdwn"
                    text: >
                      *Run Details*:
                      <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>
